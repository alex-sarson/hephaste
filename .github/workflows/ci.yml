name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trade_platform
          POSTGRES_PASSWORD: trade_platform
          POSTGRES_DB: trade_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trade_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://trade_platform:trade_platform@localhost:5432/trade_platform"
      # Enables the local-only dev-auth bypass (apps/api/src/lib/devAuth.ts)
      # for integration tests that hit a real Postgres — never set in a
      # deployed environment; devAuth.ts also refuses to activate it when
      # NODE_ENV=production regardless of this value.
      AUTH_MODE: dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @trade-platform/db exec prisma migrate deploy

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build
