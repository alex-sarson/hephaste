# Optional: `pnpm dev` (scripts/dev.mjs) starts equivalent Postgres + S3 storage
# on its own without Docker, and reuses these if they are already running.
# Note: the seaweedfs service has not been exercised — there is no Docker on
# the machine this was written on; `pnpm dev` runs the same `weed mini`.
name: hephaste

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hephaste
      POSTGRES_PASSWORD: hephaste
      POSTGRES_DB: hephaste
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hephaste"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local S3-compatible storage standing in for Cloudflare R2 in dev — see
  # brief §12. `weed mini` seeds its identity and bucket from the same env
  # names the AWS SDK reads; keep them in step with S3_* in .env.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: hephaste
      AWS_SECRET_ACCESS_KEY: hephaste-dev-secret
      S3_BUCKET: hephaste-dev
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data

volumes:
  postgres-data:
  seaweedfs-data:
