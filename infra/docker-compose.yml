name: trade-platform

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trade_platform
      POSTGRES_PASSWORD: trade_platform
      POSTGRES_DB: trade_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local S3-compatible storage standing in for Cloudflare R2 in dev — see
  # brief §12. Console at http://localhost:9001 (minioadmin/minioadmin).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
